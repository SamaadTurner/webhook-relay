# Runs the relay in a container with its database on a named volume.
# Copy .env.example to .env and fill it in first.
services:
  relay:
    build: .
    ports:
      - "8080:8080"
    environment:
      Relay__DestinationUrl: ${RELAY_DESTINATION_URL}
      Relay__AdminApiKey: ${RELAY_ADMIN_API_KEY}
      Relay__DailyCallBudget: ${RELAY_DAILY_CALL_BUDGET:-1000}
      # One line per sender. "demo" is the name used in the URL: /webhooks/demo
      Relay__Sources__demo__Secret: ${RELAY_DEMO_SECRET}
    volumes:
      - relay-data:/data
    restart: unless-stopped

volumes:
  relay-data:
